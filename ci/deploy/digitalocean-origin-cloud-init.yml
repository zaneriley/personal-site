#cloud-config
package_update: true
package_upgrade: false

ssh_pwauth: false
disable_root: true

users:
  - default
  - name: deploy
    groups:
      - sudo
      - docker
    shell: /bin/bash
    sudo:
      - ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - __DEPLOY_SSH_PUBLIC_KEY__

packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - git
  - jq

runcmd:
  - systemctl enable --now docker
  - mkdir -p /var/lib/personal-site
  - chown deploy:deploy /var/lib/personal-site
  - docker version
  - docker compose version

final_message: "personal-site disposable Docker host is ready after $UPTIME seconds"
