name: "CI"

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"
      - "master"

permissions:
  contents: read

jobs:
  workflow-lint:
    name: "Workflow lint"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"

      - name: "Workflow lint"
        run: ./run ci:workflow-lint

  gate-integrity:
    name: "Gate integrity"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"

      - name: "Acceptance-gate bypass check"
        run: ./run ci:acceptance-gate-bypass-check

      - name: "Acceptance-gate bypass fixture test"
        run: ./run ci:acceptance-gate-bypass-check:test

  disposable-host-check:
    name: "Disposable host check"
    runs-on: "ubuntu-22.04"

    steps:
      - uses: "actions/checkout@v6"

      - name: "Disposable host check"
        run: ./run ci:disposable-host-check

  compile:
    name: "Compile"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"
      - uses: "./.github/actions/setup-ci"

      - name: "Compile"
        run: ./run ci:compile

  lint:
    name: "Lint"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"
      - uses: "./.github/actions/setup-ci"

      - name: "Lint"
        run: ./run ci:lint

  security:
    name: "Security check"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"
      - uses: "./.github/actions/setup-ci"

      - name: "Security check"
        run: ./run ci:security-check

  test:
    name: "Test"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"
      - uses: "./.github/actions/setup-ci"

      - name: "Run tests"
        run: ./run ci:test

  static-analysis:
    name: "Static analysis"
    runs-on: "ubuntu-22.04"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CONTENT_REPO_URL: ${{ secrets.CONTENT_REPO_URL }}
      DC: run

    steps:
      - uses: "actions/checkout@v6"
      - uses: "./.github/actions/setup-ci"

      - name: "Static analysis"
        run: ./run ci:static-analysis
