name: "Candidate image"

on:
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: "candidate-image-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  candidate-image:
    name: "Candidate image"
    runs-on: "ubuntu-22.04"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: "actions/checkout@v6"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Login to GitHub Container Registry"
        uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Prepare image names"
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${image}:candidate-sha-${GITHUB_SHA}"
          page_acceptance_tag="${image}:preview-page-acceptance-sha-${GITHUB_SHA}"

          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "page_acceptance_tag=${page_acceptance_tag}" >> "${GITHUB_OUTPUT}"

      - name: "Build and push candidate app image"
        id: app_build
        uses: "docker/build-push-action@v7"
        with:
          context: .
          push: true
          target: "prod"
          platforms: "linux/amd64"
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Non-release candidate image for runtime viability

      - name: "Build and push preview page acceptance image"
        id: page_acceptance_build
        uses: "docker/build-push-action@v7"
        with:
          context: .
          push: true
          target: "preview-page-acceptance"
          platforms: "linux/amd64"
          tags: ${{ steps.image.outputs.page_acceptance_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=One-shot preview page acceptance image

      - name: "Write candidate image receipt"
        run: |
          mkdir -p .tmp/ci-artifacts/candidate-image

          jq -n \
            --arg image "${{ steps.image.outputs.image }}" \
            --arg tag "${{ steps.image.outputs.tag }}" \
            --arg digest "${{ steps.app_build.outputs.digest }}" \
            --arg page_acceptance_tag "${{ steps.image.outputs.page_acceptance_tag }}" \
            --arg page_acceptance_digest "${{ steps.page_acceptance_build.outputs.digest }}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF_NAME}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{
              image: $image,
              tag: $tag,
              digest: $digest,
              image_ref: ($image + "@" + $digest),
              preview_page_acceptance_tag: $page_acceptance_tag,
              preview_page_acceptance_digest: $page_acceptance_digest,
              preview_page_acceptance_image_ref: ($image + "@" + $page_acceptance_digest),
              sha: $sha,
              ref: $ref,
              run_id: $run_id,
              purpose: "non-release candidate image for disposable runtime viability"
            }' > .tmp/ci-artifacts/candidate-image/candidate-image.json

          jq '.' .tmp/ci-artifacts/candidate-image/candidate-image.json

      - name: "Upload candidate image receipt"
        uses: "actions/upload-artifact@v7"
        with:
          name: "candidate-image"
          path: ".tmp/ci-artifacts/candidate-image/candidate-image.json"
          if-no-files-found: "error"
          retention-days: 7
