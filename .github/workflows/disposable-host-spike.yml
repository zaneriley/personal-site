name: "Disposable host spike"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Disposable host action"
        required: true
        default: "status"
        type: choice
        options:
          - "status"
          - "create"
          - "destroy"
      droplet_id:
        description: "DigitalOcean Droplet ID for status/destroy"
        required: false
        type: string
      region:
        description: "DigitalOcean region"
        required: true
        default: "sfo3"
        type: choice
        options:
          - "sfo3"
      size:
        description: "DigitalOcean size slug"
        required: true
        default: "s-1vcpu-1gb"
        type: choice
        options:
          - "s-1vcpu-1gb"
      image:
        description: "DigitalOcean image slug"
        required: true
        default: "ubuntu-24-04-x64"
        type: choice
        options:
          - "ubuntu-24-04-x64"

permissions:
  contents: read

concurrency:
  group: "disposable-host-${{ inputs.action }}-${{ inputs.droplet_id || 'new' }}"
  cancel-in-progress: false

jobs:
  digitalocean-host:
    name: "DigitalOcean host"
    runs-on: "ubuntu-22.04"
    environment: "preview"
    timeout-minutes: 20

    steps:
      - uses: "actions/checkout@v6"
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: "Install host dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: "Create disposable host"
        if: ${{ inputs.action == 'create' }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DEPLOY_SSH_PUBLIC_KEY: ${{ secrets.DEPLOY_SSH_PUBLIC_KEY }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DO_REGION: ${{ inputs.region }}
          DO_SIZE: ${{ inputs.size }}
          DO_IMAGE: ${{ inputs.image }}
          PRESERVE_FAILED_HOST: "0"
        run: ./run host:disposable:create

      - name: "Show disposable host status"
        if: ${{ inputs.action == 'status' }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_ID: ${{ inputs.droplet_id }}
        run: ./run host:disposable:status

      - name: "Destroy disposable host"
        if: ${{ inputs.action == 'destroy' }}
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          DROPLET_ID: ${{ inputs.droplet_id }}
          CONFIRM_DESTROY: "1"
        run: ./run host:disposable:destroy

      - name: "Upload host receipt"
        if: ${{ always() && inputs.action == 'create' }}
        uses: "actions/upload-artifact@v7"
        with:
          name: "digitalocean-host"
          path: ".tmp/ci-artifacts/disposable-host/digitalocean-host.json"
          if-no-files-found: "error"
          retention-days: 2
