name: "Release Please"

on:
  push:
    branches:
      - "main"

jobs:
  release-please:
    runs-on: "ubuntu-22.04"
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: "googleapis/release-please-action@v4"
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: ".release-please-config.json"
          manifest-file: ".release-please-manifest.json"

      - name: "Enable auto-merge for release PR"
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number // empty' <<<"${RELEASE_PR}")"
          if [ -z "${pr_number}" ]; then
            echo "Release Please did not expose a PR number:"
            jq . <<<"${RELEASE_PR}"
            exit 1
          fi

          gh pr merge "${pr_number}" --auto --merge

  build-and-push:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
      packages: write
    steps:
      - uses: "actions/checkout@v4"

      - name: "Set up Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Login to GitHub Container Registry"
        uses: "docker/login-action@v4"
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and push"
        uses: "docker/build-push-action@v7"
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ${{ needs.release-please.outputs.prerelease != 'true' && format('ghcr.io/{0}:latest', github.repository) || '' }}
