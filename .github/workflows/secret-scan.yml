name: "Secret scan"

on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"
      - "master"

jobs:
  gitleaks:
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Install gitleaks"
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Baseline suppresses 2 pre-existing findings (same HMAC secret in
      # endpoint.ex:18 and Untitled-1.sh). Delete .gitleaks.baseline.json
      # after the secret is rotated and both files are cleaned up; a fresh
      # scan should then return 0 leaks unaided.
      - name: "Scan full history"
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --baseline-path .gitleaks.baseline.json \
            --log-opts="--all" \
            --exit-code 1
